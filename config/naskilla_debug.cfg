# NaSkilla Reader Stage-1 debug controls.
# Copied to /mnt/ext1/system/state/naskilla/debug.cfg only if missing.
# After a Draw crash, draw_safe_text sticky-forces text until deleted.
#
# render=text|auto|pattern
# draw_probe=0..6
#   0 diag only, 1 header check, 2 Draw scratch (no blit),
#   3 scratch+blit, 4 styles, 5 cover, 6 wrap page_buf
# crash_test=0|1
#
# Ladder: start at 2 after a crash. Raise one step at a time.
render=auto
draw_probe=6
crash_test=0
